<main id="app">

  <!-- Форма добавления города -->
  <section id="city-form-section">
    <h3>Добавить город</h3>
    <form id="city-form" autocomplete="off">
      <input type="text" id="city-input" placeholder="Введите название города" />
      <ul id="city-suggestions" hidden></ul>
      <p id="city-error" hidden>Город не найден</p>
      <button type="submit">Добавить</button>
    </form>
  </section>

  <!-- Основная локация -->
  <section id="current-location">
    <h2>Текущее местоположение</h2>
    <div id="forecast" class="forecast-list"></div>
  </section>

  <!-- Карточки добавленных городов -->
  <section id="cities-cards">
    <!-- Карточки будут добавляться сюда -->
  </section>

  <!-- Состояния приложения -->
  <section id="app-status">
    <p id="loading" hidden>Загрузка данных о погоде...</p>
    <p id="error" hidden>Произошла ошибка при получении данных</p>
  </section>

</main>

<script src="js/ui.js"></script>
<script src="js/geolocation.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/cities.js"></script>
