<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогноз погоды</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Фавикон (если есть) -->
  <!-- <link rel="icon" href="assets/favicon.ico" type="image/x-icon"> -->
</head>
<body>
  <main id="app">

    <!-- Состояния приложения (загрузка и ошибка) -->
    <section id="app-status">
      <p id="loading" hidden>Загрузка данных о погоде...</p>
      <p id="error" hidden>Произошла ошибка при получении данных</p>
    </section>

    <!-- Форма добавления города + кнопки -->
    <section id="city-form-section">
      <h3>Добавить город</h3>

      <form id="city-form" autocomplete="off">
        <input
          type="text"
          id="city-input"
          placeholder="Введите название города"
          required
        />

        <!-- Выпадающий список подсказок -->
        <ul id="city-suggestions" hidden></ul>

        <!-- Сообщение об ошибке -->
        <p id="city-error" class="error-message" hidden>Город не найден</p>

        <button type="submit">Добавить</button>
      </form>

      <!-- Группа кнопок: Обновить и Начать заново -->
      <div class="buttons-group">
        <button type="button" id="refresh-btn">
          Обновить погоду
        </button>
        <button type="button" id="reset-btn">
          Начать заново
        </button>
      </div>
    </section>

    <!-- Блок основной локации (геолокация или первый введённый город) -->
    <section id="current-location" hidden>
      <h2>Текущее местоположение</h2>
      <div class="forecast-list" id="main-forecast"></div>
    </section>

    <!-- Список добавленных городов -->
    <section id="cities-list-section">
      <h3>Добавленные города</h3>

      <ul id="cities-list">
        <!-- Карточки городов будут добавляться динамически -->
      </ul>
    </section>

  </main>

  <!-- Подключение скриптов в правильном порядке -->
  <script src="js/ui.js"></script>
  <script src="js/geolocation.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cities.js"></script>
</body>
</html>
